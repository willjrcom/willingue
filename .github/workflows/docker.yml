name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for unit tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test learning rules
        run: npm run test:unit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/willjrcom/willingue:latest
            ghcr.io/willjrcom/willingue:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::Missing DOKPLOY_WEBHOOK_URL repository secret"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --max-time 60 \
            --output /dev/null \
            "$DOKPLOY_WEBHOOK_URL"
          echo "Dokploy deployment webhook triggered successfully."
